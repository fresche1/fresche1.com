<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-es="Confirmación de Pago - FRESCHE" data-en="Payment Confirmation - FRESCHE">Confirmación de Pago - FRESCHE</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .response-container {
            max-width: 600px;
            margin: 4rem auto;
            padding: 3rem;
            background: rgba(30, 30, 30, 0.95);
            border: 2px solid rgba(212, 175, 55, 0.3);
            border-radius: 15px;
            text-align: center;
        }

        .response-icon {
            font-size: 5rem;
            margin-bottom: 1.5rem;
        }

        .response-icon.success {
            color: #4caf50;
        }

        .response-icon.pending {
            color: #ff9800;
        }

        .response-icon.declined {
            color: #f44336;
        }

        .response-title {
            font-size: 2rem;
            color: var(--gold);
            margin-bottom: 1rem;
        }

        .response-message {
            color: #fff;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .response-details {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 1.5rem;
            margin: 2rem 0;
            text-align: left;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 0.8rem 0;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            color: #fff;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: rgba(255, 255, 255, 0.7);
        }

        .detail-value {
            color: var(--gold);
            font-weight: 600;
        }

        .btn-home {
            display: inline-block;
            padding: 1.2rem 3rem;
            background: linear-gradient(135deg, var(--gold), #ffd700);
            color: #000;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1.1rem;
            transition: all 0.3s;
            margin-top: 1rem;
        }

        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.5);
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="/favicon.ico?v=3" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=3">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=3">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3">
<link rel="manifest" href="/site.webmanifest?v=3">
<meta name="theme-color" content="#faf6f0">
<meta name="apple-mobile-web-app-title" content="FRESCHE">
<meta name="application-name" content="FRESCHE">
    <link rel="stylesheet" href="fresche-theme.css?v=20261012">
<meta property="og:image" content="https://fresche1.com/icon-512.png">
<script src="fresche-lang.js?v=20261013"></script>
</head>
<body>
    <header class="fx-head"><div class="fx-head-in"><a href="index.html"><img src="img/logo-gold-dark.png" alt="FRESCHE"></a><nav><a href="index.html#productos" class="opt" data-es="Tienda" data-en="Shop">Tienda</a><a href="politicas.html" data-es="Políticas" data-en="Policies">Políticas</a><a href="https://wa.me/573017606723" rel="noopener">WhatsApp</a></nav></div></header>
    <div class="response-container">
        <div id="response-content"></div>
    </div>

    <script>
        // Seguridad: el estado del pago NUNCA se toma de la URL. Se consulta al backend,
        // que lo verifica directamente con Mercado Pago / Stripe / PayPal.
        // Todo dato se pinta con textContent (sin innerHTML) para evitar XSS.
        const IS_LOCALHOST = ['localhost', '127.0.0.1'].includes(window.location.hostname);
        const BACKEND_URL = IS_LOCALHOST ? 'http://localhost:3001' : 'https://fresche1-payments-api.onrender.com';
        const T = (es, en) => (window.FL && window.FL.lang === 'en' ? en : es);
        const PROVIDER_NAMES = { mercadopago: 'Mercado Pago', stripe: 'Stripe', paypal: 'PayPal' };

        function el(tag, className, text) {
            const node = document.createElement(tag);
            if (className) node.className = className;
            if (text !== undefined) node.textContent = text;
            return node;
        }

        function renderResponse({ icon, status, title, message, details = [], clearCart = false }) {
            if (clearCart) {
                localStorage.removeItem('freshCart');
                localStorage.removeItem('orderData');
            }
            const contentDiv = document.getElementById('response-content');
            contentDiv.replaceChildren();
            contentDiv.appendChild(el('div', `response-icon ${status}`, icon));
            contentDiv.appendChild(el('h1', 'response-title', title));
            contentDiv.appendChild(el('p', 'response-message', message));
            if (details.length) {
                const box = el('div', 'response-details');
                details.forEach(({ label, value }) => {
                    const row = el('div', 'detail-row');
                    row.appendChild(el('span', 'detail-label', label));
                    row.appendChild(el('span', 'detail-value', value ? String(value) : 'N/A'));
                    box.appendChild(row);
                });
                contentDiv.appendChild(box);
            }
            const home = el('a', 'btn-home', T('🏠 Volver al Inicio', '🏠 Back to Home'));
            home.href = 'index.html';
            contentDiv.appendChild(home);
        }

        function formatAmount(amount, currency) {
            if (amount === undefined || amount === null || amount === '') return 'N/A';
            const n = Number(amount);
            if (!Number.isFinite(n)) return 'N/A';
            return currency === 'COP' ? `$${Math.round(n).toLocaleString('es-CO')} COP` : `$${n.toFixed(2)} ${currency || 'USD'}`;
        }

        async function parsePaymentResponse() {
            const params = new URLSearchParams(window.location.search);
            const provider = PROVIDER_NAMES[params.get('provider')] ? params.get('provider') : 'mercadopago';
            const providerName = PROVIDER_NAMES[provider];

            if (params.get('status') === 'cancel') {
                renderResponse({ icon: '⚠️', status: 'declined', title: T('Pago Cancelado', 'Payment Cancelled'), message: T(`Cancelaste el pago en ${providerName}. Puedes intentarlo de nuevo cuando quieras.`, `You cancelled the payment on ${providerName}. You can try again anytime.`) });
                return;
            }

            const query = new URLSearchParams({ provider });
            if (provider === 'mercadopago') query.set('payment_id', params.get('payment_id') || params.get('collection_id') || '');
            if (provider === 'stripe') query.set('session_id', params.get('session_id') || '');
            if (provider === 'paypal') query.set('orderId', params.get('orderId') || params.get('token') || '');
            const idValue = [...query.values()][1];

            if (!idValue) {
                renderResponse({ icon: '❓', status: 'pending', title: T('No pudimos verificar tu pago', 'We could not verify your payment'), message: T('No recibimos una referencia de pago válida. Si pagaste, escríbenos por WhatsApp al +57 301 760 6723 con tu comprobante.', 'We did not receive a valid payment reference. If you paid, message us on WhatsApp at +57 301 760 6723 with your receipt.') });
                return;
            }

            renderResponse({ icon: '⏳', status: 'pending', title: T('Verificando tu pago…', 'Verifying your payment…'), message: T(`Estamos confirmando el estado de tu pago con ${providerName}.`, `We are confirming your payment status with ${providerName}.`) });

            let result = null;
            try {
                const res = await fetch(`${BACKEND_URL}/api/payment-status?${query.toString()}`);
                result = await res.json();
                if (!res.ok) result = null;
            } catch (e) {
                result = null;
            }

            if (!result || result.verified !== true) {
                renderResponse({ icon: '❓', status: 'pending', title: T('No pudimos verificar tu pago', 'We could not verify your payment'), message: T('Aún no podemos confirmar el pago. Si ya pagaste, recibirás confirmación; o escríbenos por WhatsApp al +57 301 760 6723.', 'We cannot confirm the payment yet. If you already paid, you will receive confirmation; or message us on WhatsApp at +57 301 760 6723.') });
                return;
            }

            const details = [
                { label: T('Proveedor:', 'Provider:'), value: providerName },
                { label: T('Referencia:', 'Reference:'), value: result.reference },
                { label: T('Monto:', 'Amount:'), value: formatAmount(result.amount, result.currency) }
            ];
            const st = String(result.status || '').toLowerCase();
            if (result.approved === true) {
                renderResponse({ icon: '✅', status: 'success', title: T('¡Pago Exitoso!', 'Payment Successful!'), message: T(`Tu pago con ${providerName} fue confirmado. Te contactaremos para coordinar la entrega.`, `Your ${providerName} payment was confirmed. We will contact you to arrange delivery.`), details, clearCart: true });
            } else if (['rejected', 'cancelled', 'refunded', 'charged_back', 'voided', 'expired'].includes(st)) {
                renderResponse({ icon: '❌', status: 'declined', title: T('Pago No Completado', 'Payment Not Completed'), message: T(`El pago con ${providerName} no se completó. Intenta nuevamente o usa otro método.`, `The ${providerName} payment was not completed. Try again or use another method.`), details });
            } else {
                renderResponse({ icon: '⏳', status: 'pending', title: T('Pago Pendiente', 'Payment Pending'), message: T(`Tu pago con ${providerName} está en proceso. Te notificaremos cuando se confirme.`, `Your ${providerName} payment is being processed. We will notify you once it is confirmed.`), details });
            }
        }

        window.addEventListener('DOMContentLoaded', parsePaymentResponse);
    </script>
    <footer class="fx-foot">© 2026 FRESCHE · <a href="politicas.html" data-es="Políticas de envío y devoluciones" data-en="Shipping &amp; returns policy">Políticas de envío y devoluciones</a> · <a href="mailto:fresche@fresche1.com">fresche@fresche1.com</a></footer>
</body>
</html>
